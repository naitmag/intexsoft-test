[isort]
profile = black
line_length = 120
skip = .venv, venv

[flake8]
max-line-length = 120
max-complexity = 15
max-cognitive-complexity = 10
inline-quotes = double
multiline-quotes = double
docstring-quotes = double
enable-extensions = G
exclude =
    .*
    venv
    .venv
    src/alembic/
ignore = E203
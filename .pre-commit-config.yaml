repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        args: [ "--config=setup.cfg" ]
        language: python
        types: [ python ]

  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        args: [ "--check" ]
        language: python
        types: [ python ]

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        args: [ "--check-only", "--profile=black" ]
        language: python
        types: [ python ]

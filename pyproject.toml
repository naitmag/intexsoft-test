[project]
name = "intexsoft"
version = "0.1.0"
description = ""
authors = [
    { name = "Mikhail Yarmolovich", email = "me.yarmolovich@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer (>=0.20.0,<0.21.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.3.0,<5.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)"
]

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
(
  \.git
  | \.gitignore
  | \.venv
  | __pycache__
)
'''

[pytest]
addopts = "-ra"
asyncio_mode = "auto"
